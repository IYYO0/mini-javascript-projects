<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Countdown Timer</h1>
      <div id="countdown" class="countdown">
        <span id="days">00</span>Days <span id="hours">00</span>Hours
        <span id="minutes">00</span>Minutes <span id="seconds">00</span>Seconds
      </div>

      <div class="input-container">
        <input type="number" id="inputHours" min="0" placeholder="hours" />
        <input
          type="number"
          id="inputMinutes"
          min="0"
          max="59"
          placeholder="minutes"
        />
        <input
          type="number"
          id="inputSeconds"
          min="0"
          max="59"
          placeholder="seconds"
        />
        <button id="startButton">Start Timer</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
